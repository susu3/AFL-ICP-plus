[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aflicp-harness"
version = "0.1.0"
description = "Source-grounded, offline-first ICS protocol fuzzing harness"
requires-python = ">=3.8"
dependencies = ["PyYAML>=6,<7", "PyMuPDF>=1.24.12,<2"]

[project.optional-dependencies]
documents = []
layout = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]

[project.scripts]
aflicp = "aflicp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aflicp = ["prompts/*.md", "schemas/*.json", "targets/recipes/libmodbus/*.c"]
